name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Core unit tests (+ WebKit compile of the real filter lists)
        env:
          ADBLOCK_LIVE_TESTS: "1"
        run: swift test --package-path Packages/AdBlockCore

      - name: YouTube extension script tests
        run: node --test Extensions/YouTubeWebExtension/Tests/*.test.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild build \
            -project AdBlock.xcodeproj \
            -scheme AdBlock \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Check the extensions are embedded correctly
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/AdBlock.app
          ls "$APP/PlugIns"
          test -f "$APP/PlugIns/YouTubeExtension.appex/manifest.json"
          test -f "$APP/PlugIns/YouTubeExtension.appex/youtube-main.js"
          test -f "$APP/PlugIns/YouTubeExtension.appex/icon-128.png"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APP/PlugIns/YouTubeExtension.appex/Info.plist"
